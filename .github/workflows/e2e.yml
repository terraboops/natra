name: E2E (Layer 4)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: k3d e2e + cluster chaos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Build natra binary (Linux native, no Docker wrap)
        run: make build-cni-inner
      - name: Install k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.7.4 bash
      - name: Run Layer 4 tests
        run: go test -tags=e2e -v -timeout=20m ./test/e2e/...
