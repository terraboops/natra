name: E2E (Layer 4)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind e2e + cluster chaos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Build natra binary (Linux native, no Docker wrap)
        run: make build-cni-inner
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run Layer 4 tests
        run: go test -tags=e2e -v -timeout=20m ./test/e2e/...
