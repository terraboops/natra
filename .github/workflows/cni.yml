name: CNI Protocol (Layer 2)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cni:
    name: CNI integration + chaos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Install netns prerequisites
        # iproute2 is required by the test helpers (netlink-driven veth
        # setup falls back to `ip` for some link operations on older
        # netlink versions).
        run: sudo apt-get install -y -qq iproute2
      - name: Build natra binary
        # Native Linux build path — `make build-cni-inner` runs locally
        # (no Docker wrap on the runner).
        run: make build-cni-inner
      - name: Run Layer 2 tests
        run: |
          # ubuntu-latest runners are root-equivalent via passwordless
          # sudo. CAP_NET_ADMIN is available for netns operations.
          sudo -E env "PATH=$PATH" go test -tags=integration -v ./test/cni/...
