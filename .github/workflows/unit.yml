name: Unit + Fuzz + Bench (Layer 1)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Run unit tests
        run: go test -race ./pkg/... ./internal/... ./cmd/... -coverprofile cover.out
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./cover.out
          fail_ci_if_error: false
          # Tokenless uploads on protected branches now require an explicit
          # opt-out. Without this, codecov errors out and (despite
          # fail_ci_if_error: false) leaves an annotation muddying the run.
          token: ${{ secrets.CODECOV_TOKEN }}

  fuzz:
    name: Fuzz (30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fuzz only targets pkg/cni/config which doesn't import pkg/bpf,
      # so we can skip the BPF build here. Saves ~30s per run.
      - name: Fuzz parser invariants
        # -fuzztime is the *generation* budget; iterations in flight when
        # the deadline fires can take a few seconds to wind down on a
        # slow runner. -test.timeout caps the whole job a comfortable
        # margin above fuzztime so wind-down doesn't trip the test
        # framework's deadline.
        run: |
          go test -fuzz=FuzzParseBandwidthAnnotation -fuzztime=30s -test.timeout=2m -run=^$ ./pkg/cni/config/...

  bench:
    name: Bench (compare to main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Check out and build main
        run: |
          git worktree add "$RUNNER_TEMP/base" origin/main
          cd "$RUNNER_TEMP/base"
          make build-bpf
          cp bpf/natra.bpf.o pkg/bpf/natra.bpf.o
      # Interleaved rounds, 10 samples per side, each side on its own
      # go.mod toolchain. Benchmark results must never get worse: any
      # significant regression that reproduces on a second A/B fails.
      - name: Bench main vs HEAD
        run: scripts/bench-check.sh "$RUNNER_TEMP/base" . bench-out
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-out/
