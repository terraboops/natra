name: Unit + Fuzz + Bench (Layer 1)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Run unit tests
        run: go test -race ./pkg/... -coverprofile cover.out
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./cover.out
          fail_ci_if_error: false
          # Tokenless uploads on protected branches now require an explicit
          # opt-out. Without this, codecov errors out and (despite
          # fail_ci_if_error: false) leaves an annotation muddying the run.
          token: ${{ secrets.CODECOV_TOKEN }}

  fuzz:
    name: Fuzz (30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fuzz only targets pkg/cni/config which doesn't import pkg/bpf,
      # so we can skip the BPF build here. Saves ~30s per run.
      - name: Fuzz parser invariants
        # -fuzztime is the *generation* budget; iterations in flight when
        # the deadline fires can take a few seconds to wind down on a
        # slow runner. -test.timeout caps the whole job a comfortable
        # margin above fuzztime so wind-down doesn't trip the test
        # framework's deadline.
        run: |
          go test -fuzz=FuzzParseBandwidthAnnotation -fuzztime=30s -test.timeout=2m -run=^$ ./pkg/cni/config/...

  bench:
    name: Bench (compare to main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Bench HEAD
        run: |
          go test -bench=. -benchmem -benchtime=1s -run=^$ ./pkg/... | tee bench-head.txt
      - name: Bench main baseline
        run: |
          # Main may not have benchmarks at first push to a PR branch — the
          # `|| echo` fallback keeps the workflow green; the compare step
          # below skips the diff when bench-main.txt is empty.
          git fetch origin main
          git stash --include-untracked || true
          git checkout origin/main || git checkout main || true
          # build-bpf again at the main commit, since pkg/bpf/natra.bpf.o
          # may differ between branches.
          (sudo apt-get install -y -qq clang llvm make libbpf-dev linux-libc-dev >/dev/null && \
           make build-bpf && cp bpf/natra.bpf.o pkg/bpf/natra.bpf.o) || true
          go test -bench=. -benchmem -benchtime=1s -run=^$ ./pkg/... | tee bench-main.txt || echo "no benchmarks on main yet"
          git checkout -
          git stash pop || true
      - name: Compare with benchstat
        run: |
          if [ -s bench-main.txt ]; then
            benchstat bench-main.txt bench-head.txt | tee bench-compare.txt
          else
            echo "No baseline on main yet — skipping regression check"
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-*.txt
