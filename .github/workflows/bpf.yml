name: BPF Dataplane (Layer 3)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single-kernel run on the GH Actions runner's kernel. lvh-based
  # multi-kernel matrix was attempted and removed: the upstream
  # quay.io/lvh-images/kind:<version> tags bit-rotted (manifest unknown)
  # and lvh's image-pull retried indefinitely. When/if the lvh registry
  # stabilises, the matrix can come back as a separate workflow named
  # bpf-matrix.yml without disturbing this file.
  bpf:
    name: BPF tests on runner kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Show runner kernel
        run: uname -r
      - name: Run Layer 3 tests
        run: |
          sudo -E env "PATH=$PATH" go test -tags=bpf -v ./test/bpf/...
