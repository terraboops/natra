name: Perf (Layer 5)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single-kernel run on the GH Actions runner. lvh-based multi-kernel
  # matrix was attempted and removed for the same reason as bpf.yml —
  # the lvh image tags bit-rotted. Re-introduce as perf-matrix.yml when
  # quay.io/lvh-images stabilises.
  perf:
    name: Perf scenarios on runner kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Show runner kernel
        run: uname -r
      - name: Run Layer 5 tests
        # KERNEL=local matches the baseline file name we ship in
        # test/perf/baselines/local.json — different from the lvh path
        # which would have used kernel-version-named baselines.
        env:
          KERNEL: local
        run: |
          sudo -E env "PATH=$PATH" KERNEL=$KERNEL go test -tags=perf -v ./test/perf/...
