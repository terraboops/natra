name: Perf (Layer 5)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single-kernel run on the GH Actions runner.
  perf:
    name: Perf scenarios on runner kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      - name: Show runner kernel
        run: uname -r
      - name: Run Layer 5 tests
        # KERNEL=local matches test/perf/baselines/local.json.
        env:
          KERNEL: local
        run: |
          sudo -E env "PATH=$PATH" KERNEL=$KERNEL go test -tags=perf -v ./test/perf/...
