name: CI

# Single aggregator status check. Branch protection should require this
# job, and an autonomous agent reading `gh run view` only needs to look
# at this one workflow to know if the push is green.
#
# This workflow has no logic of its own — it consumes the conclusions of
# the per-layer workflows via the GitHub Checks API by waiting on them.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Same BPF prep as the per-layer workflows — golangci-lint
      # type-checks pkg/bpf which requires the embed file to exist.
      - uses: ./.github/actions/build-bpf
      # golangci-lint must be built against the same Go version (or
      # newer) as the repo it lints. natra targets go 1.25; v2.3.0
      # was built with go 1.24 and rejects the config. v2.5.0+ is
      # built with go 1.25.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/build-bpf
      # `make build-cni-inner` skips the `fmt vet` chain that `make
      # build` runs first — fmt+vet would re-`go vet ./...` against the
      # whole tree, including pkg/bpf which needs the embed file we
      # just produced. Doing fmt+vet separately AFTER the BPF prep
      # keeps the build job linear.
      - run: |
          go fmt ./...
          go vet ./...
          make build-cni-inner

  # `all-green` waits for every other workflow on this commit to finish.
  # If any of them failed, this job fails too — giving branch protection
  # one signal to gate on instead of five.
  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: always()
    steps:
      - name: Verify lint and build passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "lint or build failed"
            exit 1
          fi
      # Per-layer workflows (unit/cni/bpf/e2e/perf) report their own
      # status checks. Branch protection should require those *plus*
      # this aggregator. The aggregator catches "lint and build" so a
      # single required status covers the fast checks too.
