kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: natra-e2e
# Two nodes so cross-node traffic exercises the real CNI installer path.
# kindnet stays as the main CNI — natra is a chained bandwidth-limiter
# plugin that layers on top, not a main CNI replacement.
networking:
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
  - role: worker
