apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-bidi
  namespace: natra-e2e
  annotations:
    # Both directions throttled at 10 Mbps. Used by Topology C
    # (sequential bidi: forward + reverse iperf3 back-to-back) and
    # Topology G (proxy-like simultaneous via iperf3 --bidir).
    kubernetes.io/ingress-bandwidth: "10M"
    kubernetes.io/egress-bandwidth: "10M"
  labels:
    app: iperf-server-bidi
spec:
  nodeSelector:
    kubernetes.io/hostname: k3d-natra-e2e-agent-0
  containers:
    - name: iperf
      image: taoyou/iperf3-alpine:latest@sha256:c70f1a38eff69571c79ae0bb60df6745d04c947acca1b6178a3bc3ee9b4d4572
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-bidi
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-bidi
  ports:
    - port: 5201
      targetPort: 5201
