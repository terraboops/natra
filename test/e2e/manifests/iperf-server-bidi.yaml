apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-bidi
  namespace: natra-e2e
  annotations:
    # Both directions throttled at 10 Mbps. Used by Topology C
    # (sequential bidi: forward + reverse iperf3 back-to-back) and
    # Topology G (proxy-like simultaneous via iperf3 --bidir).
    kubernetes.io/ingress-bandwidth: "10M"
    kubernetes.io/egress-bandwidth: "10M"
  labels:
    app: iperf-server-bidi
spec:
  nodeSelector:
    kubernetes.io/hostname: natra-e2e-worker
  containers:
    - name: iperf
      image: networkstatic/iperf3:latest
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-bidi
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-bidi
  ports:
    - port: 5201
      targetPort: 5201
