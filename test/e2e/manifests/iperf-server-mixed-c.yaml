apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-mixed-c
  namespace: natra-e2e
  # Intentionally no bandwidth annotations — Topology D asserts this
  # pod is unaffected while mixed-a is throttled on the same node.
  labels:
    app: iperf-server-mixed-c
spec:
  nodeSelector:
    kubernetes.io/hostname: k3d-natra-e2e-agent-0
  containers:
    - name: iperf
      image: taoyou/iperf3-alpine:latest@sha256:c70f1a38eff69571c79ae0bb60df6745d04c947acca1b6178a3bc3ee9b4d4572
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-mixed-c
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-mixed-c
  ports:
    - port: 5201
      targetPort: 5201
