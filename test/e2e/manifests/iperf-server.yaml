apiVersion: v1
kind: Pod
metadata:
  name: iperf-server
  namespace: natra-e2e
  annotations:
    # The bandwidth limit natra is supposed to enforce on this pod.
    kubernetes.io/ingress-bandwidth: "10M"
  labels:
    app: iperf-server
spec:
  # Pin to the worker node so client (on control-plane) generates cross-node
  # traffic, exercising the real veth/qdisc path.
  nodeSelector:
    kubernetes.io/hostname: natra-e2e-worker
  containers:
    - name: iperf
      image: networkstatic/iperf3:latest
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server
  ports:
    - port: 5201
      targetPort: 5201
