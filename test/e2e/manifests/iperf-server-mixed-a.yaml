apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-mixed-a
  namespace: natra-e2e
  annotations:
    # Mixed topology — only this pod is throttled. mixed-b and mixed-c
    # share the same node and have no annotations, so they should
    # achieve baseline throughput.
    kubernetes.io/ingress-bandwidth: "10M"
  labels:
    app: iperf-server-mixed-a
spec:
  nodeSelector:
    kubernetes.io/hostname: natra-e2e-worker
  containers:
    - name: iperf
      image: networkstatic/iperf3:latest
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-mixed-a
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-mixed-a
  ports:
    - port: 5201
      targetPort: 5201
