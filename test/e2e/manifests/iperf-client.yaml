apiVersion: v1
kind: Pod
metadata:
  name: iperf-client
  namespace: natra-e2e
  labels:
    app: iperf-client
spec:
  # Co-located with iperf-server on the worker node. natra's BPF
  # program attaches to iperf-server's eth0 ingress hook regardless of
  # where the traffic originates, so same-node still exercises the
  # full rate-limit datapath. Cross-node testing is a follow-up — see
  # the multi-node TODO in test/e2e/README.md.
  nodeSelector:
    kubernetes.io/hostname: natra-e2e-worker
  containers:
    - name: iperf
      image: networkstatic/iperf3:latest
      command: ["sleep", "infinity"]
