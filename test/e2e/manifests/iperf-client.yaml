apiVersion: v1
kind: Pod
metadata:
  name: iperf-client
  namespace: natra-e2e
  labels:
    app: iperf-client
spec:
  # Pinned to the control-plane node so traffic to iperf-server crosses
  # the inter-node fabric (flannel host-gw between docker-bridged
  # k3d nodes), exercising natra's filter on the *server*-side veth
  # where the packet arrives from a remote source — the
  # production-shaped scenario.
  nodeSelector:
    kubernetes.io/hostname: k3d-natra-e2e-server-0
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: iperf
      image: taoyou/iperf3-alpine:latest@sha256:c70f1a38eff69571c79ae0bb60df6745d04c947acca1b6178a3bc3ee9b4d4572
      command: ["sleep", "infinity"]
