apiVersion: v1
kind: Pod
metadata:
  name: iperf-client
  namespace: natra-e2e
  labels:
    app: iperf-client
spec:
  # Pinned to the control-plane node so traffic to iperf-server crosses
  # the inter-node fabric (kindnet bridge + vxlan), exercising natra's
  # clsact filter on the *server* side veth where the packet arrives
  # from a remote source — the production-shaped scenario.
  nodeSelector:
    kubernetes.io/hostname: natra-e2e-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: iperf
      image: networkstatic/iperf3:latest
      command: ["sleep", "infinity"]
