apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-mixed-b
  namespace: natra-e2e
  # Intentionally no bandwidth annotations — Topology D asserts this
  # pod is unaffected while mixed-a is throttled on the same node.
  labels:
    app: iperf-server-mixed-b
spec:
  nodeSelector:
    kubernetes.io/hostname: natra-e2e-worker
  containers:
    - name: iperf
      image: networkstatic/iperf3:latest
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-mixed-b
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-mixed-b
  ports:
    - port: 5201
      targetPort: 5201
