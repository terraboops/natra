apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-egress
  namespace: natra-e2e
  annotations:
    # Egress only — outbound traffic from this pod is throttled to 10
    # Mbps. iperf3 client uses -R (reverse) so the server is the data
    # sender and the throttle measures correctly.
    kubernetes.io/egress-bandwidth: "10M"
  labels:
    app: iperf-server-egress
spec:
  nodeSelector:
    kubernetes.io/hostname: k3d-natra-e2e-agent-0
  containers:
    - name: iperf
      image: taoyou/iperf3-alpine:latest@sha256:c70f1a38eff69571c79ae0bb60df6745d04c947acca1b6178a3bc3ee9b4d4572
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-egress
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-egress
  ports:
    - port: 5201
      targetPort: 5201
