apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-noplugin
  namespace: natra-e2e
  # Intentionally no bandwidth annotations. Topology F runs this pod
  # twice: once on a cluster without natra (baseline) and once after
  # natra is installed (regression check). Throughput delta must stay
  # under 10% — natra without an annotation is supposed to be a no-op.
  labels:
    app: iperf-server-noplugin
spec:
  nodeSelector:
    kubernetes.io/hostname: k3d-natra-e2e-agent-0
  containers:
    - name: iperf
      image: taoyou/iperf3-alpine:latest@sha256:c70f1a38eff69571c79ae0bb60df6745d04c947acca1b6178a3bc3ee9b4d4572
      args: ["-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-noplugin
  namespace: natra-e2e
spec:
  selector:
    app: iperf-server-noplugin
  ports:
    - port: 5201
      targetPort: 5201
