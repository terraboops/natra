apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: natra-installer
  namespace: kube-system
  labels:
    app: natra
    component: cni-installer
spec:
  selector:
    matchLabels:
      app: natra
      component: cni-installer
  template:
    metadata:
      labels:
        app: natra
        component: cni-installer
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      # Init container does the work, then exits. Pod readiness is
      # naturally gated on init completion — no marker file, no
      # readinessProbe shimming. The pause container exists only to
      # keep the Pod present so the DaemonSet controller is happy and
      # `kubectl get pods` shows one entry per node.
      initContainers:
        - name: install
          image: ghcr.io/terraboops/natra:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              # Mount bpffs into the host's mount namespace via
              # Bidirectional propagation so it survives this init
              # container exiting. Kubelet's CNI invocations need
              # /sys/fs/bpf available long after the install finishes.
              if ! mountpoint -q /host/sys/fs/bpf; then
                mount -t bpf bpffs /host/sys/fs/bpf || true
                echo "natra: mounted bpffs on /sys/fs/bpf"
              fi

              install -m 0755 /usr/local/bin/natra /host/opt/cni/bin/natra
              # File capabilities: kubelet/containerd exec the natra
              # CNI plugin without CAP_BPF or CAP_PERFMON in the
              # ambient set, so BPF_OBJ_PIN returns EPERM. setcap
              # gives the binary ambient caps on every exec regardless
              # of caller's cap_inheritable mask.
              if command -v setcap >/dev/null 2>&1; then
                setcap cap_bpf,cap_net_admin,cap_perfmon,cap_sys_resource+ep /host/opt/cni/bin/natra || true
                echo "natra: file caps set"
              else
                echo "natra: setcap unavailable; relying on caller caps"
              fi
              echo "natra: binary installed at /opt/cni/bin/natra"

              # Wait for at least one *.conflist to appear (kindnet
              # writes its conflist after its own DaemonSet starts),
              # then patch ONCE. We don't loop — every rewrite of the
              # conflist triggers containerd's inotify watch, and
              # rapid rewrites can race with sandbox creation,
              # surfacing as "failed to find network info for sandbox"
              # CRI errors.
              while ! ls /host/etc/cni/net.d/*.conflist >/dev/null 2>&1; do
                sleep 1
              done
              /usr/local/bin/natra install-cni-chain /host/etc/cni/net.d/
              echo "natra: chain install complete"
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /host/opt/cni/bin
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
            - name: host-sys
              mountPath: /host/sys
              # Bidirectional so the bpffs mount escapes into the
              # host's mount namespace — without it, the mount would
              # die with this container.
              mountPropagation: Bidirectional
          securityContext:
            privileged: true
      # Pause sidecar: anchors the Pod for the DaemonSet controller's
      # benefit. No CPU, no work, no logs of its own. Same image
      # kubelet uses for Pod sandbox containers, so it's already
      # cached on every node.
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1m"
              memory: "1Mi"
            limits:
              cpu: "10m"
              memory: "8Mi"
      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-net-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
