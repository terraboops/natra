apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: natra-installer
  namespace: kube-system
  labels:
    app: natra
    component: cni-installer
spec:
  selector:
    matchLabels:
      app: natra
      component: cni-installer
  template:
    metadata:
      labels:
        app: natra
        component: cni-installer
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      # Init container does the work, then exits. Pod readiness is
      # naturally gated on init completion — no marker file, no
      # readinessProbe shimming. The pause container exists only to
      # keep the Pod present so the DaemonSet controller is happy and
      # `kubectl get pods` shows one entry per node.
      initContainers:
        - name: install
          image: ghcr.io/terraboops/natra:latest
          imagePullPolicy: IfNotPresent
          # NATRA_ATTACH_MODE controls how natra hooks BPF onto pod
          # veths. Empty (default) → auto, which expands to an
          # ordered fallback chain whose head depends on the resolved
          # EDT mode:
          #   - edtPacing=off:  tcx-host → tcx-pod → clsact-host → clsact-pod
          #     (host-side first matches cilium / aws-network-policy-agent's
          #     coexistence shape; composes via bpf_mprog on kernel 6.6+).
          #   - edtPacing=auto (default): tcx-pod → clsact-pod →
          #     tcx-host → clsact-host (pod-side first so an fq install
          #     on pod-eth0 sits downstream of the BPF program).
          #   - edtPacing=on: tcx-pod → clsact-pod only (host-side drops
          #     out — EDT requires pod-side).
          # Set explicitly to one of {tcx-hostside, tcx-podside,
          # clsact-hostside, clsact-podside} to pin a single attempt
          # with no fallback.
          #
          # NATRA_EDT_PACING={auto,on,off}. Default is auto: natra
          # probes `fq` install on pod-eth0 at CNI ADD and uses the
          # EDT path on success, falling back to drop semantics on
          # failure. `on` requires fq (attach errors if install
          # fails); `off` never installs fq and always drops after
          # ECN-mark — pick `off` if cilium/NPA on the host already
          # owns the qdisc layout you'd rather not perturb. The legacy
          # {1,true,yes} forms map to `on`; {0,false,no} map to `off`.
          env:
            - name: NATRA_ATTACH_MODE
              value: ""
            - name: NATRA_EDT_PACING
              value: ""
            # NATRA_FASTPASS_TIME_CONSTANT_MS sets how long each new
            # flow gets at the pod's annotated rate before crossing
            # natra's heavy-hitter threshold. Default 100 ms. The
            # per-pod threshold is computed as:
            #   rate_bps × time_constant_ms / 1000   (bytes)
            # so a 10 Mbps pod gets a ~125 KiB threshold and a 1 Gbps
            # pod gets ~12.5 MiB. Floored at 16 KiB. Raise for
            # workloads with larger HTTP responses; lower for
            # workloads with many parallel long-lived flows.
            - name: NATRA_FASTPASS_TIME_CONSTANT_MS
              value: ""
            # NATRA_DEFAULT_HH_THRESHOLD overrides the rate-scaled
            # threshold with a fixed cluster-wide byte value. Unset
            # (default): per-pod threshold scales with annotated
            # rate per FASTPASS_TIME_CONSTANT_MS. Set to a positive
            # integer to pin every pod to the same threshold —
            # useful when cluster workloads are homogeneous and the
            # per-rate scaling would over- or under-shoot.
            - name: NATRA_DEFAULT_HH_THRESHOLD
              value: ""
            # NATRA_DEFAULT_BURST_RATIO sets the bucket-capacity as
            # seconds of credit at the configured rate. Default 0.5
            # — a 10 Mbps pod gets a 625 KB bucket (0.5 sec of credit),
            # which keeps measured throughput within ~3-5% of the
            # configured rate over a 15-second window. Raise toward
            # 1.0 for spikier workloads that need more burst headroom;
            # lower toward 0.1 for stricter caps. Burst is floored at
            # one max-GRO super-packet (64 KB) so a single skb is
            # always admittable even at very low rates.
            - name: NATRA_DEFAULT_BURST_RATIO
              value: ""
          command:
            - /bin/sh
            - -ec
            - |
              # Mount bpffs into the host's mount namespace via
              # Bidirectional propagation so it survives this init
              # container exiting. Kubelet's CNI invocations need
              # /sys/fs/bpf available long after the install finishes.
              if ! mountpoint -q /host/sys/fs/bpf; then
                mount -t bpf bpffs /host/sys/fs/bpf || true
                echo "natra: mounted bpffs on /sys/fs/bpf"
              fi

              # Install natra at every CNI bin path containerd might
              # be configured to search. Different distros put the
              # CNI bin dir in different places, and we'd rather pay a
              # few extra MB of disk than ship a configuration that
              # only works on the cluster shape we tested last:
              #
              #   /opt/cni/bin                       — kind default,
              #                                        the standard
              #                                        containernetworking
              #                                        path on most distros
              #   /var/lib/rancher/k3s/data/cni      — k3s 1.30+ default
              #   /bin                               — older k3s configs
              #                                        (bin_dir = "/bin"
              #                                        observed in CI on
              #                                        k3d's default
              #                                        rancher/k3s image)
              #
              # The DaemonSet declares hostPath mounts for all three;
              # paths that genuinely don't exist on the host get auto-
              # created by DirectoryOrCreate. setcap on every copy so
              # BPF_OBJ_PIN works no matter which one kubelet exec's.
              for dst in /host/opt/cni/bin /host/var-k3s-cni /host/bin; do
                if [ -d "$dst" ]; then
                  install -m 0755 /usr/local/bin/natra "$dst/natra"
                  if command -v setcap >/dev/null 2>&1; then
                    setcap cap_bpf,cap_net_admin,cap_perfmon,cap_sys_resource+ep "$dst/natra" || true
                  fi
                  echo "natra: binary installed at $dst/natra"
                fi
              done
              if ! command -v setcap >/dev/null 2>&1; then
                echo "natra: setcap unavailable; relying on caller caps"
              fi

              # Wait for at least one *.conflist to appear (kindnet
              # writes its conflist after its own DaemonSet starts),
              # then patch ONCE. We don't loop — every rewrite of the
              # conflist triggers containerd's inotify watch, and
              # rapid rewrites can race with sandbox creation,
              # surfacing as "failed to find network info for sandbox"
              # CRI errors.
              #
              # The conflist dir varies by distribution:
              #   /etc/cni/net.d                       — kind, kubeadm,
              #                                          most distros'
              #                                          containerd
              #   /var/lib/rancher/k3s/agent/etc/cni/net.d
              #                                        — k3s default;
              #                                          k3d uses this
              # Detect which one the current node uses and patch that
              # one. We mount both as separate volumes; the wait + the
              # install-cni-chain target the directory that actually
              # has a conflist.
              cni_conf_dir=""
              while [ -z "$cni_conf_dir" ]; do
                for d in /host/etc/cni/net.d /host/var-k3s-cni-conf; do
                  if ls "$d"/*.conflist >/dev/null 2>&1; then
                    cni_conf_dir="$d"
                    break
                  fi
                done
                [ -z "$cni_conf_dir" ] && sleep 1
              done
              echo "natra: patching conflist dir $cni_conf_dir"
              /usr/local/bin/natra install-cni-chain "$cni_conf_dir"
              echo "natra: chain install complete"
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /host/opt/cni/bin
            - name: cni-bin-k3s
              mountPath: /host/var-k3s-cni
            - name: cni-bin-root
              mountPath: /host/bin
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
            - name: cni-net-dir-k3s
              mountPath: /host/var-k3s-cni-conf
            - name: host-sys
              mountPath: /host/sys
              # Bidirectional so the bpffs mount escapes into the
              # host's mount namespace — without it, the mount would
              # die with this container.
              mountPropagation: Bidirectional
          securityContext:
            privileged: true
      # Pause sidecar: anchors the Pod for the DaemonSet controller's
      # benefit. No CPU, no work, no logs of its own. Same image
      # kubelet uses for Pod sandbox containers, so it's already
      # cached on every node.
      #
      # CMS aging happens in the BPF program itself (lazy decay on
      # cell access — see bpf/natra.bpf.c) so there's no userspace
      # daemon to run here.
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1m"
              memory: "1Mi"
            limits:
              cpu: "10m"
              memory: "8Mi"
      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-bin-k3s
          hostPath:
            path: /var/lib/rancher/k3s/data/cni
            type: DirectoryOrCreate
        - name: cni-bin-root
          # CI's k3d image observed in 2026-05 has containerd
          # configured with cni bin_dir = /bin (an unusual k3s
          # default). Mounting /bin RO-or-RW lets us install
          # natra there too. DirectoryOrCreate keeps the manifest
          # portable; /bin always exists in practice.
          hostPath:
            path: /bin
            type: Directory
        - name: cni-net-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: cni-net-dir-k3s
          # k3s writes its conflist here, not /etc/cni/net.d.
          # DirectoryOrCreate so non-k3s nodes don't fail; the
          # init container picks whichever directory actually
          # contains a *.conflist.
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
            type: DirectoryOrCreate
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
