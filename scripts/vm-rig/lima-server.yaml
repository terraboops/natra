# Lima VM template for the k3s server node (control-plane). One of
# two VMs that form the natra kernel-isolated test cluster.
#
# Each VM runs its own Linux kernel. Inter-VM traffic crosses the
# `lima` shared network (socket_vmnet on macOS, libvirt/KVM bridged
# on Linux) — a real virtual NIC pair, not a shared bridge in one
# kernel.
#
# Debian 13 (trixie) ships kernel 6.12 — well above the 6.6
# threshold for TCX (bpf_mprog), so natra's preferred attach
# mode works out of the box. clsact remains the kernel-5.x
# fallback inside the loader if anything in the chain breaks.
# Debian rather than Ubuntu because cloud.debian.org is
# better-mirrored than cloud-images.ubuntu.com from constrained
# networks — same cloud-init / apt / systemd shape either way.

images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"

cpus: 2
memory: "2GiB"
disk: "12GiB"

# The shared network gives this VM and the agent VM L2 reachability
# via socket_vmnet (Mac) / lima's default-bridged (Linux). Required
# for k3s server↔agent join and pod-to-pod traffic.
networks:
  - lima: shared

# No host mounts — the natra image is copied in explicitly by the
# up script via `limactl copy`, and tests drive the cluster from
# the host's kubectl after the kubeconfig is exported.
mounts: []

# socket_vmnet on macOS only routes to IPs it assigned via DHCP;
# our static lima0 addresses (see provision script) are visible
# from the agent VM (VM↔VM is unaffected) but NOT from the host.
# Forward the k3s API to host loopback so `kubectl` from the
# host can reach it via the lima SSH tunnel. The agent VM still
# reaches the server directly at 192.168.105.10:6443.
portForwards:
  - guestPort: 6443
    hostIP: "127.0.0.1"
    hostPort: 6443

# Install k3s server on first boot. --disable=traefik,servicelb
# trims the default k3s addons we don't need; --node-ip pins the
# advertised address to the shared-network interface so the agent
# can reach it. Token is written to a known path the agent picks
# up via `limactl shell`.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail

      # Wait for the lima-shared interface to exist (link-only is
      # enough — we don't depend on DHCP because some lima/socket_vmnet
      # combos don't complete DHCPv4 on the shared subnet, leaving
      # lima0 link-up but without an IPv4 lease).
      for _ in $(seq 1 60); do
        if ip link show lima0 2>/dev/null | grep -q 'state UP'; then
          break
        fi
        sleep 1
      done

      # Static IP in the lima-shared subnet (socket_vmnet hands out
      # 192.168.105.0/24 by default). Server pins .10, agent pins
      # .11 — predictable, conflict-free for a single rig instance.
      LIMA_IP=192.168.105.10
      ip addr add ${LIMA_IP}/24 dev lima0 2>/dev/null || true
      echo "$LIMA_IP" > /etc/natra-server-ip

      # flannel-backend=host-gw: each node sets a kernel route
      # "<other-node pod-cidr> via <other-node-ip> dev lima0", and
      # pod-to-pod cross-node traffic uses that direct route.
      # Caveat: requires the kernel's ARP for the other node's
      # lima0 IP to resolve, which only works reliably when
      # socket_vmnet/vmnet has learned the IP (via DHCP, normally).
      # Static IPs (see provision-script comments) work for the
      # k3s server↔agent control-plane join because that traffic
      # routes via the lima-usernet NAT path, but pod-to-pod
      # forwarding through host-gw may not work without a
      # DHCP-learned vmnet entry. The floor assertion in
      # cmd/vm-rig/test.go catches "iperf measured 0 bps" cases
      # so we don't silently pass.
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="v1.31.4+k3s1" \
        INSTALL_K3S_EXEC="server --disable=traefik,servicelb --flannel-backend=host-gw --node-ip=${LIMA_IP} --advertise-address=${LIMA_IP} --tls-san=${LIMA_IP}" \
        sh -

      # Token at a predictable path so up.sh can read it via shell
      # exec. /var/lib/rancher/k3s/server/node-token is the canonical
      # location; expose a world-readable copy for the rig.
      install -m 0644 /var/lib/rancher/k3s/server/node-token /etc/natra-node-token
