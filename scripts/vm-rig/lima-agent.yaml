# Lima VM template for the k3s agent node (worker). Pairs with
# lima-server.yaml. up.sh starts the server first, reads the join
# token + IP via `limactl shell natra-server cat ...`, exports them
# as env vars before starting the agent, and this provision script
# reads them via the lima `env` channel below.
#
# Same kernel/image/network choices as server — see lima-server.yaml.

# Image source: saimei.ftp.acc.umu.se, not cloud.debian.org — see
# lima-server.yaml for the rationale (cloud.debian.org round-robin
# hangs on a degraded backend + trips a lima digest-less bug).
images:
  # Listed in order; lima tries each in sequence and uses the first
  # that downloads cleanly. saimei is the primary; laotzu and the
  # canonical cloud.debian.org are fallbacks for the days saimei is
  # dropping EOFs mid-transfer (which it does periodically).
  - location: "https://saimei.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"
  - location: "https://laotzu.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"
  - location: "https://saimei.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"
  - location: "https://laotzu.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"

cpus: 2
memory: "2GiB"
disk: "12GiB"

networks:
  - lima: shared

mounts: []

# These come from `limactl start --set='.env.NATRA_K3S_URL=...'`
# in up.sh after the server is ready.
env:
  NATRA_K3S_URL: ""
  NATRA_K3S_TOKEN: ""

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail

      if [ -z "${NATRA_K3S_URL:-}" ] || [ -z "${NATRA_K3S_TOKEN:-}" ]; then
        echo "natra vm-rig: NATRA_K3S_URL / NATRA_K3S_TOKEN must be set on the agent VM" >&2
        exit 1
      fi

      # Static lima0 IP — agent pins .11 (server pins .10). No
      # vmnet DHCP (unreliable on this stack); networkd owns lima0
      # statically via a 05- drop-in. See lima-server.yaml for the
      # full rationale (verified: static cross-VM ping/ARP works;
      # the real cross-VM fix is --flannel-iface=lima0).
      LIMA_IP=192.168.105.11
      for _ in $(seq 1 30); do
        ip link show lima0 >/dev/null 2>&1 && break
        sleep 1
      done
      mkdir -p /etc/systemd/network
      printf '[Match]\nName=lima0\n[Network]\nAddress=%s/24\nDHCP=no\n' \
        "$LIMA_IP" > /etc/systemd/network/05-natra-lima0.network
      networkctl reload
      networkctl reconfigure lima0
      for _ in $(seq 1 30); do
        ip -4 -o addr show lima0 2>/dev/null | grep -q "${LIMA_IP}/24" && break
        sleep 1
      done
      if ! ip -4 -o addr show lima0 | grep -q "${LIMA_IP}/24"; then
        echo "natra vm-rig: failed to set static ${LIMA_IP} on lima0" >&2
        exit 1
      fi

      # --flannel-iface=lima0: pin flannel's inter-node interface
      # to the shared vmnet network. Without it flannel picks eth0
      # (the per-VM-isolated user-mode NAT) and cross-VM pod
      # traffic black-holes. See lima-server.yaml — this is the
      # actual fix for the original symptom.
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="v1.31.4+k3s1" \
        K3S_URL="${NATRA_K3S_URL}" \
        K3S_TOKEN="${NATRA_K3S_TOKEN}" \
        INSTALL_K3S_EXEC="agent --node-ip=${LIMA_IP} --flannel-iface=lima0" \
        sh -
